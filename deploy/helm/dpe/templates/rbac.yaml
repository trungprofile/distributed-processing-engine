{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "dpe.operatorServiceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dpe.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- if .Values.rbac.create }}
---
# Generated from the +kubebuilder:rbac markers on the reconciler; keep in step
# with config/rbac/role.yaml. No wildcards: every verb here is one the
# reconcile loop actually issues.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "dpe.fullname" . }}-operator
  labels:
    {{- include "dpe.labels" . | nindent 4 }}
rules:
  - apiGroups: ["dpe.trungprofile.dev"]
    resources: ["processingjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["dpe.trungprofile.dev"]
    resources: ["processingjobs/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["dpe.trungprofile.dev"]
    resources: ["processingjobs/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["statefulsets/status"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "dpe.fullname" . }}-operator
  labels:
    {{- include "dpe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "dpe.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "dpe.operatorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
---
# Leader election is namespaced: the lease lives beside the operator, so this
# stays a Role rather than widening the ClusterRole above.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "dpe.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dpe.labels" . | nindent 4 }}
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "dpe.fullname" . }}-leader-election
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "dpe.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "dpe.fullname" . }}-leader-election
subjects:
  - kind: ServiceAccount
    name: {{ include "dpe.operatorServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
