name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.22", "1.24"]

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l $(find . -name '*.go' -not -name '*.pb.go'))
          if [ -n "$unformatted" ]; then echo "$unformatted"; exit 1; fi

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build -trimpath ./...

      # The integration tests run against the Redis service container, so the
      # kill-a-node / zero-loss assertion is enforced on every push.
      - name: go test
        env:
          REDIS_ADDR: localhost:6379
        run: go test ./... -race -timeout 300s
